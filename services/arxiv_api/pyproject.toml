[project]
name = "arxiv-api"
version = "0.1.0"
description = "API for arXiv data layer"
authors = [
    {name = "Brad Edwards",email = "j.bradley.edwards@gmail.com"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "boto3 (>=1.37.6,<2.0.0)",
    "aws-lambda-powertools (>=3.7.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
