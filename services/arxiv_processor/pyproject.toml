[tool.poetry]
name = "arxiv-processor"
version = "0.1.0"
description = "ECS task for processing arXiv papers"
authors = ["AtomikLabs Team <info@atomiklabs.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
boto3 = "^1.37.6"
requests = "^2.31.0"
defusedxml = "^0.7.1"
pydantic = "^2.10.6"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.0.0"
pytest-mock = "^3.12.0"
# Note: The shared package is mocked in tests, not directly installed

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = [".", "src", "tests", "../.."]
addopts = "--cov=src --cov-report=term-missing" 