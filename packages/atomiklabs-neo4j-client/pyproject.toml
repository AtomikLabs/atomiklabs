[tool.poetry]
name = "atomiklabs-neo4j-client"
version = "0.1.0"
description = "Neo4j client"
authors = ["Brad Edwards <j.bradley.edwards@gmail.com>"]
readme = "README.md"
packages = [{include = "atomiklabs", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11"
python-dotenv = ">=1.0.0"
neo4j = ">=5.28.1,<6.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
