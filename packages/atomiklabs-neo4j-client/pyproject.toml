[project]
name = "atomiklabs-neo4j-client"
version = "0.1.0"
description = "Neo4j client"
authors = [
    { name = "Brad Edwards", email = "j.bradley.edwards@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "neo4j>=5.28.1,<6.0.0"
]

[tool.poetry]
packages = [{include = "atomiklabs", from = "src"}]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
