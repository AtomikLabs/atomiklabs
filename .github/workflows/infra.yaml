name: infra

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

permissions:
      id-token: write
      contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: ./infra
    
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_CI_CD_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Package Lambda
        run: |
          echo "Creating build directory..."
          mkdir -p build
          chmod 777 build
          
          echo "Packaging Lambda code..."
          cd ../services/arxiv_mailer/src
          zip -r ../../../infra/build/mailer.zip ./*
          
          echo "Verifying zip contents..."
          cd ../../../infra
          unzip -l build/mailer.zip
          
          echo "Build directory contents:"
          ls -la build/
          
          echo "Calculating source_code_hash..."
          sha256sum build/mailer.zip
          base64 -w0 build/mailer.zip | sha256sum

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.AWS_CORE_STATE_S3 }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform Plan
        env:
          TF_VAR_environment: ${{ vars.ENVIRONMENT }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_resource_uuid: ${{ vars.AWS_RESOURCE_UUID }}
          TF_VAR_email_config: ${{ vars.AWS_EMAIL_CONFIG }}
          TF_VAR_nvd_api_key: ${{ secrets.NVD_API_KEY }}
          TF_VAR_monitored_systems: ${{ vars.MONITORED_SYSTEMS }}
          TF_VAR_laptop_pub_key: ${{ secrets.LAPTOP_PUB_KEY }}
          TF_VAR_neo4j_password: ${{ secrets.NEO4J_PASSWORD }}
          TF_LOG: DEBUG
        run: |
          echo "Current directory contents:"
          ls -la
          echo "Build directory contents:"
          ls -la build/
          terraform plan -out=tfplan

      - name: Terraform Apply
        env:
          TF_VAR_environment: ${{ vars.ENVIRONMENT }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_resource_uuid: ${{ vars.AWS_RESOURCE_UUID }}
          TF_VAR_email_config: ${{ vars.AWS_EMAIL_CONFIG }}
          TF_VAR_nvd_api_key: ${{ secrets.NVD_API_KEY }}
          TF_VAR_monitored_systems: ${{ vars.MONITORED_SYSTEMS }}
          TF_VAR_laptop_pub_key: ${{ secrets.LAPTOP_PUB_KEY }}
          TF_VAR_neo4j_password: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          terraform apply -auto-approve tfplan
      
      - name: Configure CodeArtifact properly
        run: |
          echo "Configuring CodeArtifact repositories..."
          
          # Configure Python-Public repository to connect to PyPI
          echo "Configuring Python Public repository..."
          aws codeartifact associate-external-connection \
            --domain atomiklabs-${{ vars.ENVIRONMENT }} \
            --domain-owner ${{ vars.AWS_ACCOUNT_NUM }} \
            --repository python-public \
            --external-connection public:pypi

          # Configure Neo4j client repository to use python-public as upstream
          echo "Configuring Neo4j client repository..."
          aws codeartifact update-repository \
            --domain atomiklabs-${{ vars.ENVIRONMENT }} \
            --domain-owner ${{ vars.AWS_ACCOUNT_NUM }} \
            --repository neo4j-client \
            --upstreams repositoryName=python-public
          
          # Ensure proper origin controls for critical packages
          echo "Setting package origin controls..."
          
          # Critical packages that should come from upstream
          PACKAGES=("neo4j" "python-dotenv")
          
          for PKG in "${PACKAGES[@]}"; do
            echo "Setting origin controls for $PKG..."
            aws codeartifact put-package-origin-configuration \
              --domain atomiklabs-${{ vars.ENVIRONMENT }} \
              --domain-owner ${{ vars.AWS_ACCOUNT_NUM }} \
              --repository neo4j-client \
              --format pypi \
              --package "$PKG" \
              --restrictions "publish=BLOCK,upstream=ALLOW"
              
            # Verify configuration was applied
            aws codeartifact get-package-origin-configuration \
              --domain atomiklabs-${{ vars.ENVIRONMENT }} \
              --domain-owner ${{ vars.AWS_ACCOUNT_NUM }} \
              --repository neo4j-client \
              --format pypi \
              --package "$PKG" || echo "Package $PKG not found yet, will be configured when first used"
          done
          
          echo "CodeArtifact configuration completed"

      - name: Apply Terraform
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd infra
          terraform apply -auto-approve
          
      - name: Configure CodeArtifact upstream dependencies
        if: false  # Disable this step as it's now done properly during initial setup
        run: |
          echo "This step is now disabled as the CodeArtifact configuration is done properly during initial setup"

  publish-neo4j-client:
    needs: terraform
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      package-version: ${{ steps.set-version.outputs.version }}
    
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_CI_CD_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Check for changes in Neo4j client
        id: check-changes
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Running in PR context - will build and publish dev version"
            echo "changes=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/dev" ]]; then
            if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "packages/atomiklabs-neo4j-client/"; then
              echo "Changes detected in Neo4j client package"
              echo "changes=true" >> $GITHUB_OUTPUT
            else
              echo "No changes detected in Neo4j client package"
              echo "changes=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Not a PR or push to dev - not publishing"
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Set version number
        if: steps.check-changes.outputs.changes == 'true'
        id: set-version
        working-directory: ./packages/atomiklabs-neo4j-client
        run: |
          VERSION="0.1.0"
          
          # For PR builds, add dev suffix with run number
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="${VERSION}.dev${{ github.run_number }}"
          fi
          
          echo "Setting version to $VERSION"
          
          # Update version in setup.py
          sed -i "s/version=\"[0-9]*\.[0-9]*\.[0-9]*.*\"/version=\"$VERSION\"/" setup.py
          
          # Verify version is set
          grep "version" setup.py
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Configure CodeArtifact for dev versions
        if: github.event_name == 'pull_request' && steps.check-changes.outputs.changes == 'true'
        run: |
          # Mark dev versions as UNFINISHED so they can be overwritten
          aws codeartifact update-package-versions-status \
            --domain atomiklabs-${{ vars.ENVIRONMENT }} \
            --domain-owner ${{ vars.AWS_ACCOUNT_NUM }} \
            --repository neo4j-client \
            --format pypi \
            --package atomiklabs-neo4j-client \
            --version-status UNFINISHED \
            --versions "${{ steps.set-version.outputs.version }}" || true

      - name: Install build dependencies
        if: steps.check-changes.outputs.changes == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install build twine setuptools wheel

      - name: Build package
        if: steps.check-changes.outputs.changes == 'true'
        working-directory: ./packages/atomiklabs-neo4j-client
        run: |
          python -m build
          echo "Package contents:"
          ls -la dist/

      - name: Configure CodeArtifact access
        if: steps.check-changes.outputs.changes == 'true'
        run: |
          aws codeartifact login \
            --tool twine \
            --repository neo4j-client \
            --domain atomiklabs-${{ vars.ENVIRONMENT }} \
            --domain-owner ${{ vars.AWS_ACCOUNT_NUM }} \
            --region ${{ vars.AWS_REGION }}

      - name: Publish package
        if: steps.check-changes.outputs.changes == 'true'
        working-directory: ./packages/atomiklabs-neo4j-client
        run: |
          CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
            --domain atomiklabs-${{ vars.ENVIRONMENT }} \
            --domain-owner ${{ vars.AWS_ACCOUNT_NUM }} \
            --query authorizationToken --output text)
          
          # Add --skip-existing for production versions to avoid failures
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TWINE_USERNAME=aws TWINE_PASSWORD=${CODEARTIFACT_AUTH_TOKEN} twine upload --repository codeartifact --skip-existing dist/*
          else
            TWINE_USERNAME=aws TWINE_PASSWORD=${CODEARTIFACT_AUTH_TOKEN} twine upload --repository codeartifact dist/*
          fi
          
          echo "Published version ${{ steps.set-version.outputs.version }} to CodeArtifact"

      - name: Update service requirements for PR builds
        if: github.event_name == 'pull_request' && steps.check-changes.outputs.changes == 'true'
        run: |
          VERSION="${{ steps.set-version.outputs.version }}"
          echo "Updating service requirements to use version $VERSION"
          
          # Update each service's requirements.txt
          for SERVICE in arxiv_processor newsletter_processor nvd_checker; do
            if [ -f "services/$SERVICE/requirements.txt" ]; then
              echo "Updating services/$SERVICE/requirements.txt"
              # Replace version if already exists, otherwise add it
              if grep -q "atomiklabs-neo4j-client==" services/$SERVICE/requirements.txt; then
                sed -i "s/atomiklabs-neo4j-client==.*/atomiklabs-neo4j-client==$VERSION/" services/$SERVICE/requirements.txt
              else
                echo "atomiklabs-neo4j-client==$VERSION" >> services/$SERVICE/requirements.txt
              fi
              cat services/$SERVICE/requirements.txt | grep atomiklabs-neo4j-client
            else
              echo "File services/$SERVICE/requirements.txt not found"
            fi
          done

  build-and-push:
    needs: publish-neo4j-client
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_CI_CD_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        working-directory: ./infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.AWS_CORE_STATE_S3 }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Get ECR repository URL
        working-directory: ./infra
        run: |
          echo "Getting ECR repository URL..."
          REPO_URL=$(terraform output -raw ecr_repository_url)
          echo "ECR_REPO=$REPO_URL" >> "$GITHUB_ENV"
          echo "Stored repository URL in environment variable"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure Docker credentials
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin 920372995176.dkr.ecr.us-east-1.amazonaws.com

      - name: Get CodeArtifact token and create pip.conf files
        run: |
          # Get CodeArtifact token once
          CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
            --domain atomiklabs-${{ vars.ENVIRONMENT }} \
            --domain-owner ${{ vars.AWS_ACCOUNT_NUM }} \
            --query authorizationToken --output text)
          
          # Create pip.conf for each service with both CodeArtifact and PyPI
          for SERVICE in newsletter_processor arxiv_processor nvd_checker; do
            echo "[global]" > ./services/$SERVICE/pip.conf
            echo "index-url=https://aws:${CODEARTIFACT_AUTH_TOKEN}@atomiklabs-${{ vars.ENVIRONMENT }}-${{ vars.AWS_ACCOUNT_NUM }}.d.codeartifact.${{ vars.AWS_REGION }}.amazonaws.com/pypi/neo4j-client/simple/" >> ./services/$SERVICE/pip.conf
            echo "extra-index-url=https://pypi.org/simple/" >> ./services/$SERVICE/pip.conf
            echo "trusted-host=atomiklabs-${{ vars.ENVIRONMENT }}-${{ vars.AWS_ACCOUNT_NUM }}.d.codeartifact.${{ vars.AWS_REGION }}.amazonaws.com pypi.org" >> ./services/$SERVICE/pip.conf
          done
          
          # Verify pip.conf files were created
          echo "Verifying pip.conf files:"
          ls -la ./services/*/pip.conf
          cat ./services/arxiv_processor/pip.conf

      - name: Build and push Newsletter processor
        working-directory: ./services/newsletter_processor
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Newsletter processor image for repository: ${{ env.ECR_REPO }}"
          docker build -t ${{ env.ECR_REPO }}:newsletter .
          docker push ${{ env.ECR_REPO }}:newsletter

      - name: Build and push ArXiv processor
        working-directory: ./services/arxiv_processor
        run: |
          echo "Building ArXiv processor image for repository: ${{ env.ECR_REPO }}"
          docker build -t ${{ env.ECR_REPO }}:arxiv .
          docker push ${{ env.ECR_REPO }}:arxiv

      - name: Build and push NVD checker
        working-directory: ./services/nvd_checker
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building NVD checker image for repository: ${{ env.ECR_REPO }}"
          docker build -t ${{ env.ECR_REPO }}:nvd .
          docker push ${{ env.ECR_REPO }}:nvd
