name: infra

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

permissions:
      id-token: write
      contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: ./infra
    
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_CI_CD_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Package Lambda and Layer
        run: |
          echo "Creating build directory..."
          mkdir -p build
          chmod 777 build
          
          echo "Packaging Lambda code..."
          cd ../services/arxiv_mailer/src
          zip -r ../../../infra/build/mailer.zip ./*
          cd ../../../infra
          
          # Package data_layer as a Lambda layer
          echo "Packaging data_layer as a Lambda layer..."
          mkdir -p temp_layer/python/atomiklabs_data
          
          # Copy the data_layer package files
          echo "Copying data_layer files..."
          cp -r ../services/data_layer/src/atomiklabs_data/* temp_layer/python/atomiklabs_data/
          
          # Create an __init__.py file if it doesn't exist
          touch temp_layer/python/atomiklabs_data/__init__.py
          
          # Create the layer zip
          echo "Creating data_layer.zip..."
          cd temp_layer
          zip -r ../build/data_layer.zip python/
          cd ..
          ls -la build/
          
          # Clean up
          rm -rf temp_layer
          
          # Check if shared directory exists
          if [ -d "../services/shared" ]; then
            echo "Packaging shared layer..."
            cd ../services/shared
            ./package_layer.sh
            mv layer.zip ../../infra/build/shared_layer.zip
            cd ../../infra
          else
            echo "Shared directory not found, creating empty layer..."
            mkdir -p temp_layer/python
            cd temp_layer
            zip -r ../build/shared_layer.zip ./
            cd ..
            rm -rf temp_layer
          fi
          
          echo "Build directory contents:"
          ls -la build/

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.AWS_CORE_STATE_S3 }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-state-lock"

      - name: Terraform Plan
        env:
          TF_VAR_environment: ${{ vars.ENVIRONMENT }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_resource_uuid: ${{ vars.AWS_RESOURCE_UUID }}
          TF_VAR_email_config: ${{ vars.AWS_EMAIL_CONFIG }}
          TF_LOG: DEBUG
        run: |
          echo "Current directory contents:"
          ls -la
          echo "Build directory contents:"
          ls -la build/
          terraform plan -out=tfplan

      - name: Terraform Apply
        env:
          TF_VAR_environment: ${{ vars.ENVIRONMENT }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_resource_uuid: ${{ vars.AWS_RESOURCE_UUID }}
          TF_VAR_email_config: ${{ vars.AWS_EMAIL_CONFIG }}
        run: |
          terraform apply -auto-approve tfplan
          
          echo "Verifying Lambda function..."
          aws lambda get-function \
            --function-name $(terraform output -raw lambda_function_name) \
            --query 'Configuration.[FunctionName,LastModified,CodeSize]' \
            --output table

  build-and-push:
    needs: terraform
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_CI_CD_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        working-directory: ./infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.AWS_CORE_STATE_S3 }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-state-lock"

      - name: Get ECR repository URL
        working-directory: ./infra
        run: |
          echo "Getting ECR repository URL..."
          REPO_URL=$(terraform output -raw ecr_repository_url)
          echo "ECR_REPO=$REPO_URL" >> "$GITHUB_ENV"
          echo "Stored repository URL in environment variable"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push shared base
        run: |
          echo "Checking if shared directory exists..."
          if [ -d "./services/shared" ]; then
            echo "Building shared base image for repository: ${{ env.ECR_REPO }}"
            cd ./services/shared
            docker build -t ${{ env.ECR_REPO }}:base .
            docker push ${{ env.ECR_REPO }}:base
            cd ../../
          else
            echo "Shared directory not found, using minimal base image"
            echo 'FROM python:3.11-slim' > Dockerfile.base
            echo 'WORKDIR /app' >> Dockerfile.base
            docker build -t ${{ env.ECR_REPO }}:base -f Dockerfile.base .
            docker push ${{ env.ECR_REPO }}:base
            rm Dockerfile.base
          fi

      - name: Build and push ArXiv processor
        working-directory: ./services/arxiv_processor
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building ArXiv processor image for repository: ${{ env.ECR_REPO }}"
          cd ../../
          docker build \
            --build-arg ECR_REPO=${{ env.ECR_REPO }} \
            -f services/arxiv_processor/Dockerfile \
            -t ${{ env.ECR_REPO }}:arxiv .
          docker push ${{ env.ECR_REPO }}:arxiv

      - name: Test DB Init
        run: |
          echo "Using data_layer for database initialization..."
          cd ./services/data_layer
          pip install -e .
          echo "Database initialization package installed successfully."

      - name: Build and push DB Init
        run: |
          echo "Building Data Layer image for repository: ${{ env.ECR_REPO }}"
          cd ./services/data_layer
          # Create a temporary Dockerfile if it doesn't exist
          if [ ! -f "Dockerfile" ]; then
            echo "Creating Dockerfile for data_layer..."
            echo 'FROM python:3.11-slim' > Dockerfile
            echo '' >> Dockerfile
            echo 'WORKDIR /app' >> Dockerfile
            echo '' >> Dockerfile
            echo 'COPY . /app/' >> Dockerfile
            echo '' >> Dockerfile
            echo 'RUN pip install -e .' >> Dockerfile
            echo '' >> Dockerfile
            echo 'ENTRYPOINT ["init-db"]' >> Dockerfile
          fi
          
          docker build -t ${{ env.ECR_REPO }}:db-init .
          docker push ${{ env.ECR_REPO }}:db-init

  run-db-init:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_CI_CD_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run DB Init Task
        working-directory: ./infra
        run: |
          # Get the security group and subnet IDs
          SECURITY_GROUP=$(aws ec2 describe-security-groups --query 'SecurityGroups[0].GroupId' --output text)
          SUBNET=$(aws ec2 describe-subnets --query 'Subnets[0].SubnetId' --output text)
          
          # Get the task definition
          DB_INIT_TASK_NAME="atomiklabs-${{ vars.ENVIRONMENT }}-db-init-${{ vars.AWS_RESOURCE_UUID }}"
          CLUSTER_NAME="atomiklabs-${{ vars.ENVIRONMENT }}-cluster-${{ vars.AWS_RESOURCE_UUID }}"
          
          echo "Using task definition: $DB_INIT_TASK_NAME"
          echo "Using cluster: $CLUSTER_NAME"
          
          # Run the DB initialization task
          echo "Running DB initialization task..."
          aws ecs run-task \
            --cluster "$CLUSTER_NAME" \
            --task-definition "$DB_INIT_TASK_NAME" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET],securityGroups=[$SECURITY_GROUP],assignPublicIp=ENABLED}" \
            --count 1
            
          echo "DB initialization task started"
