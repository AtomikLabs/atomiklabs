name: infra

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

permissions:
      id-token: write
      contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: ./infra
    
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_CI_CD_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Package Lambda and Layer
        run: |
          echo "Creating build directory..."
          mkdir -p build
          chmod 777 build
          
          # We'll use Docker container for Lambda instead of zip packaging
          echo "Note: Lambda will be deployed as a container"
          
          # Still need to package the data layer for other usages
          echo "Packaging data layer for Lambda layer..."
          
          # Create requirements file for the layer
          cat > layer_requirements.txt << EOF
          SQLAlchemy==2.0.0
          psycopg2-binary==2.9.5
          boto3==1.34.0
          alembic==1.10.0
          EOF
          
          # Set up Python virtual environment for Layer
          python -m venv layer_venv
          source layer_venv/bin/activate
          pip install --upgrade pip
          pip install -r layer_requirements.txt
          
          # Install the data_layer package
          pip install -e ../services/data_layer
          
          # Create Lambda layer directory structure
          mkdir -p layer_build/python
          
          # Copy site-packages to layer
          cp -r layer_venv/lib/python*/site-packages/* layer_build/python/
          
          # Remove unnecessary packages to reduce size
          rm -rf layer_build/python/pip* layer_build/python/setuptools* layer_build/python/_distutils_hack layer_build/python/*.dist-info
          
          # Create atomiklabs_data package in the layer
          mkdir -p layer_build/python/atomiklabs_data
          cp -r ../services/data_layer/src/atomiklabs_data/* layer_build/python/atomiklabs_data/
          touch layer_build/python/atomiklabs_data/__init__.py
          
          # Create layer zip
          cd layer_build
          zip -r ../build/data_layer.zip python/
          cd ..
          
          # Clean up
          rm -rf layer_venv layer_build layer_requirements.txt
          
          echo "Build directory contents:"
          ls -la build/
          
          # Check if shared directory exists
          if [ -d "../services/shared" ]; then
            echo "Packaging shared layer..."
            cd ../services/shared
            ./package_layer.sh
            mv layer.zip ../../infra/build/shared_layer.zip
            cd ../../infra
          else
            echo "Shared directory not found, creating empty layer..."
            mkdir -p temp_layer/python
            cd temp_layer
            zip -r ../build/shared_layer.zip ./
            cd ..
            rm -rf temp_layer
          fi

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.AWS_CORE_STATE_S3 }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-state-lock"

      - name: Terraform Plan
        env:
          TF_VAR_environment: ${{ vars.ENVIRONMENT }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_resource_uuid: ${{ vars.AWS_RESOURCE_UUID }}
          TF_VAR_email_config: ${{ vars.AWS_EMAIL_CONFIG }}
          TF_LOG: DEBUG
        run: |
          echo "Current directory contents:"
          ls -la
          echo "Build directory contents:"
          ls -la build/
          terraform plan -out=tfplan

      - name: Terraform Apply
        env:
          TF_VAR_environment: ${{ vars.ENVIRONMENT }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_resource_uuid: ${{ vars.AWS_RESOURCE_UUID }}
          TF_VAR_email_config: ${{ vars.AWS_EMAIL_CONFIG }}
        run: |
          terraform apply -auto-approve tfplan
          
          echo "Verifying Lambda function..."
          aws lambda get-function \
            --function-name $(terraform output -raw lambda_function_name) \
            --query 'Configuration.[FunctionName,LastModified,CodeSize]' \
            --output table

  build-and-push:
    needs: terraform
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_CI_CD_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        working-directory: ./infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.AWS_CORE_STATE_S3 }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-state-lock"

      - name: Get ECR repository URL
        working-directory: ./infra
        run: |
          echo "Getting ECR repository URL..."
          REPO_URL=$(terraform output -raw ecr_repository_url)
          echo "ECR_REPO=$REPO_URL" >> "$GITHUB_ENV"
          echo "Stored repository URL in environment variable"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push shared base
        run: |
          echo "Checking if shared directory exists..."
          if [ -d "./services/shared" ]; then
            echo "Building shared base image for repository: ${{ env.ECR_REPO }}"
            cd ./services/shared
            docker build -t ${{ env.ECR_REPO }}:base .
            docker push ${{ env.ECR_REPO }}:base
            cd ../../
          else
            echo "Shared directory not found, using minimal base image"
            echo 'FROM python:3.11-slim' > Dockerfile.base
            echo 'WORKDIR /app' >> Dockerfile.base
            docker build -t ${{ env.ECR_REPO }}:base -f Dockerfile.base .
            docker push ${{ env.ECR_REPO }}:base
            rm Dockerfile.base
          fi

      - name: Build and push Lambda mailer container
        run: |
          echo "Building Lambda mailer container image for repository: ${{ env.ECR_REPO }}"
          docker build \
            -f services/arxiv_mailer/Dockerfile \
            -t ${{ env.ECR_REPO }}:mailer .
          docker push ${{ env.ECR_REPO }}:mailer
          
          # Get and store the image URI for use in Terraform
          MAILER_IMAGE_URI="${{ env.ECR_REPO }}:mailer"
          echo "MAILER_IMAGE_URI=$MAILER_IMAGE_URI" >> "$GITHUB_ENV"
          echo "Lambda mailer image URI: $MAILER_IMAGE_URI"

      - name: Build and push ArXiv processor
        working-directory: ./services/arxiv_processor
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building ArXiv processor image for repository: ${{ env.ECR_REPO }}"
          cd ../../
          docker build \
            --build-arg ECR_REPO=${{ env.ECR_REPO }} \
            -f services/arxiv_processor/Dockerfile \
            -t ${{ env.ECR_REPO }}:arxiv .
          docker push ${{ env.ECR_REPO }}:arxiv

      - name: Test DB Init
        run: |
          echo "Using data_layer for database initialization..."
          cd ./services/data_layer
          pip install -e .
          echo "Database initialization package installed successfully."

      - name: Build and push DB Init
        run: |
          echo "Building Data Layer image for repository: ${{ env.ECR_REPO }}"
          cd ./services/data_layer
          
          # Create a more robust Dockerfile
          cat > Dockerfile << 'EOF'
          FROM python:3.11-slim

          # Install system dependencies
          RUN apt-get update && apt-get install -y \
              build-essential \
              && rm -rf /var/lib/apt/lists/*

          WORKDIR /app

          # Copy the data layer package
          COPY . /app/

          # Install the package properly
          RUN pip install --no-cache-dir -e .

          # Verify package installation
          RUN python -c "import atomiklabs_data; print('Successfully imported atomiklabs_data')"

          # Set environment variables
          ENV PYTHONUNBUFFERED=1

          # Health check to verify proper installation
          HEALTHCHECK --interval=30s --timeout=5s --start-period=5s --retries=3 \
              CMD python -c "import atomiklabs_data; print('Container healthy')" || exit 1

          # Entry point to initialize the database
          ENTRYPOINT ["init-db"]
          EOF
          
          # Build and push the image
          docker build -t ${{ env.ECR_REPO }}:db-init .
          docker push ${{ env.ECR_REPO }}:db-init

  run-db-init:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_CI_CD_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run DB Init Task
        working-directory: ./infra
        run: |
          # Get the security group and subnet IDs
          SECURITY_GROUP=$(aws ec2 describe-security-groups --query 'SecurityGroups[0].GroupId' --output text)
          SUBNET=$(aws ec2 describe-subnets --query 'Subnets[0].SubnetId' --output text)
          
          # Get the task definition
          DB_INIT_TASK_NAME="atomiklabs-${{ vars.ENVIRONMENT }}-db-init-${{ vars.AWS_RESOURCE_UUID }}"
          CLUSTER_NAME="atomiklabs-${{ vars.ENVIRONMENT }}-cluster-${{ vars.AWS_RESOURCE_UUID }}"
          
          echo "Using task definition: $DB_INIT_TASK_NAME"
          echo "Using cluster: $CLUSTER_NAME"
          
          # Run the DB initialization task
          echo "Running DB initialization task..."
          aws ecs run-task \
            --cluster "$CLUSTER_NAME" \
            --task-definition "$DB_INIT_TASK_NAME" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET],securityGroups=[$SECURITY_GROUP],assignPublicIp=ENABLED}" \
            --count 1
            
          echo "DB initialization task started"
