name: infra

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

permissions:
      id-token: write
      contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: ./infra
    
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_CI_CD_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Setup build directory
        run: mkdir -p build/

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.AWS_CORE_STATE_S3 }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-state-lock"

      - name: Terraform Plan
        env:
          TF_VAR_environment: ${{ vars.ENVIRONMENT }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_resource_uuid: ${{ vars.AWS_RESOURCE_UUID }}
          TF_VAR_email_config: ${{ vars.AWS_EMAIL_CONFIG }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          TF_VAR_environment: ${{ vars.ENVIRONMENT }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_resource_uuid: ${{ vars.AWS_RESOURCE_UUID }}
          TF_VAR_email_config: ${{ vars.AWS_EMAIL_CONFIG }}
        run: terraform apply -auto-approve tfplan

  build-and-push:
    needs: terraform
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_CI_CD_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        working-directory: ./infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.AWS_CORE_STATE_S3 }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-state-lock"

      - name: Get ECR repository URL
        working-directory: ./infra
        run: |
          echo "Getting ECR repository URL..."
          REPO_URL=$(terraform output -raw arxiv_processor_repository_url)
          echo "Repository URL: $REPO_URL"
          echo "ECR_REPO=$REPO_URL" >> "$GITHUB_ENV"
          echo "Stored in ECR_REPO environment variable"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: ./services/arxiv_processor
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building image for repository: ${{ env.ECR_REPO }}"
          docker build -t ${{ env.ECR_REPO }}:latest .
          docker push ${{ env.ECR_REPO }}:latest
