name: infra

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

permissions:
      id-token: write
      contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: ./infra
    
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_CI_CD_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Package Lambda
        run: |
          echo "Creating build directory..."
          mkdir -p build
          chmod 777 build
          
          echo "Packaging Lambda code..."
          cd ../services/arxiv_mailer/src
          zip -r ../../../infra/build/mailer.zip ./*
          
          echo "Verifying zip contents..."
          cd ../../../infra
          unzip -l build/mailer.zip
          
          echo "Build directory contents:"
          ls -la build/
          
          echo "Calculating source_code_hash..."
          sha256sum build/mailer.zip
          base64 -w0 build/mailer.zip | sha256sum

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.AWS_CORE_STATE_S3 }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-state-lock"

      - name: Terraform Plan
        env:
          TF_VAR_environment: ${{ vars.ENVIRONMENT }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_resource_uuid: ${{ vars.AWS_RESOURCE_UUID }}
          TF_VAR_email_config: ${{ vars.AWS_EMAIL_CONFIG }}
          TF_VAR_nvd_api_key: ${{ secrets.NVD_API_KEY }}
          TF_VAR_monitored_systems: ${{ vars.MONITORED_SYSTEMS }}
          TF_LOG: DEBUG
        run: |
          echo "Current directory contents:"
          ls -la
          echo "Build directory contents:"
          ls -la build/
          terraform plan -out=tfplan

      - name: Terraform Apply
        env:
          TF_VAR_environment: ${{ vars.ENVIRONMENT }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_resource_uuid: ${{ vars.AWS_RESOURCE_UUID }}
          TF_VAR_email_config: ${{ vars.AWS_EMAIL_CONFIG }}
          TF_VAR_nvd_api_key: ${{ secrets.NVD_API_KEY }}
          TF_VAR_monitored_systems: ${{ vars.MONITORED_SYSTEMS }}
        run: |
          terraform apply -auto-approve tfplan
          
          echo "Verifying Lambda function..."
          aws lambda get-function \
            --function-name $(terraform output -raw lambda_function_name) \
            --query 'Configuration.[FunctionName,LastModified,CodeSize]' \
            --output table
            
      - name: Extract DB Info
        id: db-info
        run: |
          echo "DB_HOST=$(terraform output -raw db_host)" >> $GITHUB_OUTPUT
          echo "DB_PORT=$(terraform output -raw db_port)" >> $GITHUB_OUTPUT
          echo "DB_NAME=$(terraform output -raw db_name)" >> $GITHUB_OUTPUT
          echo "DB_USER=$(terraform output -raw db_username)" >> $GITHUB_OUTPUT
          echo "DB_PASSWORD_PARAM=$(terraform output -raw db_password_param)" >> $GITHUB_OUTPUT
        
    outputs:
      db_host: ${{ steps.db-info.outputs.DB_HOST }}
      db_port: ${{ steps.db-info.outputs.DB_PORT }}
      db_name: ${{ steps.db-info.outputs.DB_NAME }}
      db_user: ${{ steps.db-info.outputs.DB_USER }}
      db_password_param: ${{ steps.db-info.outputs.DB_PASSWORD_PARAM }}

  init-database:
    needs: terraform
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_CI_CD_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./services/data_layer
          pip install psycopg2-binary boto3 sqlalchemy
          
      - name: Get DB password from SSM
        id: get-password
        run: |
          echo "Getting database password from SSM Parameter Store..."
          DB_PASSWORD=$(aws ssm get-parameter \
            --name ${{ needs.terraform.outputs.db_password_param }} \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)
          echo "Password retrieved successfully"
          echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV
          
      - name: Initialize database schema
        env:
          DB_HOST: ${{ needs.terraform.outputs.db_host }}
          DB_PORT: ${{ needs.terraform.outputs.db_port }}
          DB_NAME: ${{ needs.terraform.outputs.db_name }}
          DB_USERNAME: ${{ needs.terraform.outputs.db_user }}
          # DB_PASSWORD is set in the previous step
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Initializing database schema if not already present..."
          CONNECTION_STRING="postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
          
          # First check if connection works and tables exist
          echo "Checking if tables already exist..."
          cat > check_db.py << 'ENDOFPYTHON'
          from services.data_layer.src.db import init_db, get_session
          from sqlalchemy import inspect
          import sys

          # Initialize connection
          init_db('$CONNECTION_STRING')

          # Check if tables exist
          with get_session() as session:
              inspector = inspect(session.get_bind())
              tables = inspector.get_table_names()
              print(f'Found {len(tables)} tables in database')
              
              if tables:
                  print('Tables already exist - skipping schema creation')
                  sys.exit(0)
              else:
                  print('No tables found - will initialize schema')
                  sys.exit(1)
          ENDOFPYTHON

          # Replace placeholder with actual connection string
          sed -i "s|\$CONNECTION_STRING|${CONNECTION_STRING}|g" check_db.py
          
          # Run the check
          python check_db.py
          
          if [ $? -eq 0 ]; then
            echo "Tables already exist, skipping initialization" 
          else
            echo "No tables found, running initialization"
            python -m services.data_layer.src.init_db --connection-string "$CONNECTION_STRING"
          fi
          
          echo "Database initialization complete"

  build-and-push:
    needs: [terraform, init-database]
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_CI_CD_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        working-directory: ./infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.AWS_CORE_STATE_S3 }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-state-lock"

      - name: Get ECR repository URL
        working-directory: ./infra
        run: |
          echo "Getting ECR repository URL..."
          REPO_URL=$(terraform output -raw ecr_repository_url)
          echo "ECR_REPO=$REPO_URL" >> "$GITHUB_ENV"
          echo "Stored repository URL in environment variable"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ArXiv processor
        working-directory: ./services/arxiv_processor
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building ArXiv processor image for repository: ${{ env.ECR_REPO }}"
          docker build -t ${{ env.ECR_REPO }}:arxiv .
          docker push ${{ env.ECR_REPO }}:arxiv

      - name: Build and push NVD checker
        working-directory: ./services/nvd_checker
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building NVD checker image for repository: ${{ env.ECR_REPO }}"
          docker build -t ${{ env.ECR_REPO }}:nvd .
          docker push ${{ env.ECR_REPO }}:nvd
