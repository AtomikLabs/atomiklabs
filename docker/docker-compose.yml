version: '3.8'

services:
  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"      # LocalStack Edge Proxy
    environment:
      - SERVICES=s3,ssm,ses,lambda,logs,iam
      - DEFAULT_REGION=us-west-2
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LAMBDA_EXECUTOR=docker
      - DATA_DIR=/tmp/localstack/data
      - DEBUG=1
    volumes:
      - ./localstack:/docker-entrypoint-initaws.d
      - /var/run/docker.sock:/var/run/docker.sock
      - localstack-data:/tmp/localstack

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=arxiv_app
      - POSTGRES_PASSWORD=localdev
      - POSTGRES_DB=arxiv
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arxiv_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  arxiv-processor:
    build:
      context: ../services/arxiv_processor
      dockerfile: Dockerfile
    profiles: ["processor", "all"]
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-west-2
      - CONFIG_PATH=/arxiv/local
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=arxiv_app
      - DB_PASSWORD=localdev
      - DB_NAME=arxiv
    depends_on:
      - localstack
      - postgres

  db-init:
    build:
      context: ../services/db_init
      dockerfile: Dockerfile
    profiles: ["db", "all"]
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-west-2
      - CONFIG_PATH=/arxiv/local
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=arxiv_app
      - DB_PASSWORD=localdev
      - DB_NAME=arxiv
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started

  nvd-checker:
    build:
      context: ../services/nvd_checker
      dockerfile: Dockerfile
    profiles: ["nvd", "all"]
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-west-2
      - CONFIG_PATH=/arxiv/local
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=arxiv_app
      - DB_PASSWORD=localdev
      - DB_NAME=arxiv
    depends_on:
      - localstack
      - postgres

volumes:
  localstack-data:
  postgres-data:
