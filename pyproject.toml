[tool.poetry]
name = "atomiklabs"
version = "0.1.0"
description = "AtomikLabs research data system"
authors = ["AtomikLabs <info@atomiklabs.com>"]
readme = "README.md"
packages = [
    {include = "services"}
]

[tool.poetry.dependencies]
python = "^3.10"
boto3 = "^1.34.0"
requests = "^2.31.0"
defusedxml = "^0.7.1"
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.5"
alembic = "^1.10.0"
python-dotenv = "^1.0.0"
python-docx = "^1.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
black = "^24.1.0"
isort = "^5.12.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py310']

[tool.isort]
profile = 'black'
line_length = 120
skip = ['__init__.py', '.venv', 'build', 'dist', 'notes']
known_first_party = ['services']
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
pythonpath = [
    'services',
    'orchestration/airflow/dags',
]